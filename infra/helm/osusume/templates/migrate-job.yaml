{{- /*
A plain resource rather than a Helm hook: a pre-install hook would run before the Secret and Postgres
it needs exist. The name changes with each revision, so every install and upgrade runs it. The api's
init container holds the api back until the migrations are in place.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "osusume.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "osusume.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "osusume.nonRootPod" (dict "uid" 1000) | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ .Release.Name }}-postgres -U osusume -d osusume; do sleep 2; done
          securityContext:
            {{- include "osusume.nonRootContainer" . | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "osusume.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, dist/db/migrate.js]
          env:
            {{- include "osusume.databaseUrlEnv" . | nindent 12 }}
          securityContext:
            {{- include "osusume.nonRootContainer" . | nindent 12 }}
