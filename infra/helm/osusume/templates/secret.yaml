{{- /*
Generated on first install and read back on every upgrade, so sessions and the database's password
stay as they were. Kept on uninstall, as the Postgres volume is: a new password would not match it.
*/ -}}
{{- $name := include "osusume.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $authSecret := get $existing "AUTH_SECRET" | default (randAlphaNum 64 | b64enc) -}}
{{- $postgresPassword := get $existing "POSTGRES_PASSWORD" | default (randAlphaNum 40 | b64enc) -}}
{{- $databaseUrl := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $databaseUrl = printf "postgres://osusume:%s@%s-postgres:5432/osusume" (b64dec $postgresPassword) .Release.Name -}}
{{- else -}}
{{- $databaseUrl = required "postgres.externalUrl is required when postgres.enabled is false" .Values.postgres.externalUrl -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "osusume.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTH_SECRET: {{ $authSecret }}
  POSTGRES_PASSWORD: {{ $postgresPassword }}
  DATABASE_URL: {{ $databaseUrl | b64enc }}
