# Backing services for local development only. The api and web run on the host.
name: osusume-dev

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: osusume-dev-pg
    environment:
      POSTGRES_USER: osusume
      POSTGRES_PASSWORD: osusume_dev
      POSTGRES_DB: osusume
    ports:
      - 127.0.0.1:54329:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U osusume -d osusume]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: docker.io/axllent/mailpit:v1.33
    container_name: osusume-dev-mailpit
    ports:
      - 127.0.0.1:1025:1025 # SMTP
      - 127.0.0.1:8025:8025 # Web UI

volumes:
  postgres-data:
